        <div xmlns="http://www.w3.org/1999/xhtml" style="font-size:14px; line-height:1.6; color:#1f1f1f;">
          <p>Selling business loans typically refers to working as a Direct Selling Agent (DSA) or loan partner who connects business owners with banks and NBFCs, earning a commission on every approved and disbursed loan. <span style="background:#fce8e6; border:1px solid #641E32; padding:2px 8px; border-radius:10px; font-size:11px; color:#641E32; font-weight:700;">WeRize +1</span></p><h4 style="margin:12px 0 6px; font-size:14px; font-weight:600;">How the Business Loan Agent (DSA) Model Works</h4><p>• <b>Role:</b> You find business owners who need working capital or expansion funds, collect paperwork, and submit it. <span style="background:#fce8e6; border:1px solid #641E32; padding:2px 8px; border-radius:10px; font-size:11px; color:#641E32; font-weight:700;">WeRize +1</span><br/>• <b>Commission Rates:</b> Agents in India typically earn around <b>1.0% to 2.0%</b> of the total business loan amount disbursed. <span style="background:#fce8e6; border:1px solid #641E32; padding:2px 8px; border-radius:10px; font-size:11px; color:#641E32; font-weight:700;">WeRize +1</span></p>
        </div>
      </foreignObject>
      
      <!-- Right Side Citation Cards Panel -->
