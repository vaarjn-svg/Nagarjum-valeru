          <text x="12" y="21" font-size="9" font-weight="700" fill="#641E32">W</text>
          <text x="30" y="21" font-size="12" font-weight="500" fill="#202124">WeRize</text>
          
          <text x="12" y="46" font-size="13" font-weight="600" fill="#1a0dab">How to Sell Business Loans Effecti</text>
          <text x="12" y="64" font-size="13" font-weight="600" fill="#1a0dab">vely: DSA Success Guide ...</text>
